<title>Training</title>
<style>:root{--bg:#1B211F;--surface:#232B27;--raised:#2B3530;--line:#35423B;--text:#EEE9DE;--muted:#A3AFA6;--faint:#6F7E74;
--teal:#57ADA0;--ochre:#D09045;--blue:#8EA2DE;--sage:#86AE8F;--rust:#CB5E48;--gold:#CFAA3A;--plum:#B792B0;--ink:#11160F;
--round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;--ui:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.app{max-width:540px;margin:0 auto}
.screen{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 104px)}
.title{font-family:var(--round);font-weight:700;font-size:32px;line-height:1.08;letter-spacing:-.01em;margin:6px 0 4px}
.h2{font-family:var(--round);font-weight:700;font-size:20px;line-height:1.2;margin:0 0 6px}
.h3{font-weight:650;font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0}
.small{font-size:13px;color:var(--muted)}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.label{font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;position:relative;overflow:hidden}
.card.flat{background:transparent}
.card.celebrate{background:color-mix(in srgb,var(--accent,var(--teal)) 18%,var(--surface));border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:15px;font-weight:650;font-size:16px;background:var(--raised);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--accent,var(--teal));color:var(--ink);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.link{color:var(--accent,var(--teal));font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:44px;padding:0 15px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.chip.sm{min-height:40px;min-width:40px;padding:0 10px;font-size:15px}
.chip.on{background:var(--accent,var(--teal));color:var(--ink);border-color:transparent;font-weight:650}
.note{display:block;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;background:var(--raised);margin:0 0 12px;color:var(--text)}
.note.warn{background:color-mix(in srgb,var(--rust) 22%,var(--surface))}
.note.gold{background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.rule-list{margin:6px 0 0;padding-left:18px;font-size:14px}
.rule-list li{margin:3px 0}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted)}
.pill.active{background:color-mix(in srgb,var(--rust) 28%,var(--surface));color:var(--text)}
.pill.monitoring{background:color-mix(in srgb,var(--gold) 24%,var(--surface));color:var(--text)}
.pill.resolved{color:var(--faint)}
.field{width:100%;min-height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:0 12px;font-family:var(--round);font-size:18px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--faint)}
.field.text,select.field{font-family:var(--ui);font-size:16px}
textarea.field{min-height:100px;padding:10px 12px;font-family:var(--ui);font-size:16px;line-height:1.4;resize:vertical}
.field.needs{border-color:var(--rust);box-shadow:0 0 0 1px var(--rust)}
.tape{position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 4px 4px 0;background:var(--accent,var(--teal))}
.plan-list{list-style:none;margin:12px 0 14px;padding:0}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.plan-list li:last-child{border-bottom:0}
.plan-list .scheme{color:var(--muted);font-size:13px;white-space:nowrap;font-family:var(--round);font-variant-numeric:tabular-nums}
.reason{font-size:14px;margin:0 0 10px;padding-left:12px;border-left:2px solid var(--accent,var(--teal))}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.ex.done .ex-check{background:var(--accent,var(--teal));border-color:transparent;color:var(--ink)}
.ex-title{flex:1;min-height:36px}
.ex-name{font-weight:650;font-size:17px}
.ex.done .ex-name{color:var(--muted)}
.ex-scheme{font-size:13px;color:var(--muted);margin-top:1px}
.ex-body{margin:10px 0 0 44px}
.how{font-size:14px;color:var(--muted);margin:0 0 8px;white-space:pre-line}
.tip{font-size:13px;color:var(--gold);margin:0 0 8px}
.sug{font-size:14px;border-radius:12px;padding:9px 12px;background:var(--raised);margin:4px 0 8px}
.sug.up{background:color-mix(in srgb,var(--accent,var(--teal)) 22%,var(--surface))}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 54px;gap:8px;align-items:center;margin-top:8px}
.setrow.one{grid-template-columns:22px 1fr 54px}
.setrow .idx{font-size:13px;color:var(--faint);text-align:center;font-family:var(--round)}
.setrow.done .field{border-color:transparent;background:color-mix(in srgb,var(--accent,var(--teal)) 18%,var(--bg))}
.tick{height:48px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.setrow.done .tick{background:var(--accent,var(--teal));border-color:transparent;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:0 14px;font-size:14px;min-height:36px}
.seg button.on{background:var(--raised);font-weight:650}
.check-row{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-hit{display:flex;gap:12px;align-items:flex-start;flex:1;padding:10px 0;min-height:44px}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.check-row.on .box{background:var(--teal);border-color:transparent;color:var(--ink)}
.ci-name{display:block;font-size:15px}
.check-row.on .ci-name{color:var(--muted);text-decoration:line-through}
.ci-desc{display:block;font-size:13px;color:var(--faint);margin-top:1px}
.week{display:flex;gap:5px;align-items:center}
.wd{width:9px;height:9px;border-radius:50%;background:var(--raised);border:1px solid var(--line)}
.wd.done{background:var(--teal);border-color:transparent}
.wd.set{border-color:var(--gold)}
.wd.today{outline:2px solid var(--muted);outline-offset:1px}
.option{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--raised);margin-bottom:8px}
.option strong{display:block;font-size:16px}
.option span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.list-row:last-child{border-bottom:0}
a.list-row{color:var(--teal)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raised)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(27,33,31,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-inner{display:flex;max-width:540px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--faint);min-height:54px;text-align:center}
.tab.on{color:var(--text)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-weight:600;min-height:44px}
.pre{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto;font-family:var(--ui)}
.bars text{fill:var(--faint);font-size:9px;font-family:var(--ui)}
.illus{background:var(--bg);border-radius:12px;padding:6px;display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
